<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard</title>
<script>if (location.search.indexOf("dark=1") > -1) document.documentElement.classList.add("dark");</script>
<style>
:root { --bg: #f0f0f1; --panel: #ffffff; --text: #1d2327; --muted: #646970; --line: #dcdcde; --accent: #2271b1; --accent-text: #ffffff; --side: #1d2327; --side-text: #c3c4c7; --ok: #d6f0dc; --ok-text: #0a5c2b; --warn: #fcf0c2; --warn-text: #6b4a00; --bad: #fbdada; --bad-text: #8a1c1c; --info: #dde9f7; --info-text: #174a7c; }
html.dark { --bg: #101317; --panel: #1a1f26; --text: #e6e8eb; --muted: #9aa3ad; --line: #2e353e; --accent: #5aa2e6; --accent-text: #0b1118; --side: #0a0d10; --side-text: #9aa3ad; --ok: #14361f; --ok-text: #8fdca8; --warn: #3b2f0c; --warn-text: #f0cf72; --bad: #3d1818; --bad-text: #f2a0a0; --info: #14304d; --info-text: #9cc7f0; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.page { padding: 28px 36px; max-width: 1400px; margin: 0 auto; }
h1 { font-size: 24px; margin: 0 0 20px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
.card .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.card .v { font-size: 30px; font-weight: 700; margin: 4px 0; } .card .d { font-size: 13px; } .up { color: var(--ok-text); } .down { color: var(--bad-text); }
.charts { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; } .card h2 { font-size: 15px; margin: 0 0 12px; }
svg { display: block; width: 100%; height: auto; } .grid { stroke: var(--line); } .lbl { fill: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<div class="page"><h1>Store overview</h1>
<div class="stats">
<div class="card"><div class="k">Net sales</div><div class="v">$48,217</div><div class="d up">+12.4% vs last month</div></div>
<div class="card"><div class="k">Orders</div><div class="v">1,306</div><div class="d up">+4.1% vs last month</div></div>
<div class="card"><div class="k">Average order</div><div class="v">$36.92</div><div class="d down">-2.3% vs last month</div></div>
<div class="card"><div class="k">Refund rate</div><div class="v">1.8%</div><div class="d up">-0.4 pts vs last month</div></div>
</div>
<div class="charts">
<div class="card"><h2>Sales over the last 30 days</h2>
<svg viewBox="0 0 640 260"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".45"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
<g class="grid"><line x1="40" y1="30" x2="630" y2="30"/><line x1="40" y1="90" x2="630" y2="90"/><line x1="40" y1="150" x2="630" y2="150"/><line x1="40" y1="210" x2="630" y2="210"/></g>
<text class="lbl" x="4" y="34">$2.4k</text><text class="lbl" x="4" y="94">$1.6k</text><text class="lbl" x="4" y="154">$0.8k</text><text class="lbl" x="4" y="214">$0</text>
<path d="M40,170 L80,150 L120,160 L160,120 L200,132 L240,96 L280,110 L320,70 L360,92 L400,62 L440,84 L480,48 L520,76 L560,52 L630,40 L630,210 L40,210 Z" fill="url(#area)"/>
<path d="M40,170 L80,150 L120,160 L160,120 L200,132 L240,96 L280,110 L320,70 L360,92 L400,62 L440,84 L480,48 L520,76 L560,52 L630,40" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>
<text class="lbl" x="40" y="236">Sep 9</text><text class="lbl" x="230" y="236">Sep 23</text><text class="lbl" x="420" y="236">Oct 7</text><text class="lbl" x="590" y="236">Oct 9</text></svg></div>
<div class="card"><h2>Orders by weekday</h2>
<svg viewBox="0 0 400 260"><g class="grid"><line x1="30" y1="210" x2="390" y2="210"/><line x1="30" y1="150" x2="390" y2="150"/><line x1="30" y1="90" x2="390" y2="90"/></g>
<g fill="var(--accent)"><rect x="44" y="120" width="34" height="90" rx="4"/><rect x="92" y="96" width="34" height="114" rx="4"/><rect x="140" y="84" width="34" height="126" rx="4"/><rect x="188" y="110" width="34" height="100" rx="4"/><rect x="236" y="60" width="34" height="150" rx="4"/><rect x="284" y="40" width="34" height="170" rx="4"/><rect x="332" y="78" width="34" height="132" rx="4"/></g>
<g class="lbl"><text x="48" y="232">Mon</text><text x="96" y="232">Tue</text><text x="142" y="232">Wed</text><text x="192" y="232">Thu</text><text x="244" y="232">Fri</text><text x="288" y="232">Sat</text><text x="336" y="232">Sun</text></g></svg></div>
</div></div>
</body>
</html>
