name: Dual-host compatibility

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  generated-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Check generated Codex files
        run: python scripts/generate_codex_compat.py --check

      - name: Test dual-host contracts
        run: python -m pytest plugins/pirategoat-tools/tests/test_codex_marketplace.py -v
