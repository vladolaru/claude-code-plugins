# Repo-wide pytest configuration.
#
# --import-mode=importlib gives every collected test module a unique,
# path-derived module name. Without it, each plugin's tests/ directory
# competes for the same top-level module/package names and running two
# plugin suites in one session fails at collection (see
# plugins/pirategoat-tools/tests/test_pytest_layout.py for the guards
# and the full failure story). Suite-root tests/__init__.py files must
# also stay deleted — the guard test enforces both halves.
[pytest]
addopts = --import-mode=importlib
